site_name: filament shortcut keys
# Set this to your documentation site's public URL once it is live.
site_url: https://docs.aristonis.org/filament-shortcut-keys/
repo_url: https://github.com/aristonis/filament-shortcut-keys
repo_name: aristonis/filament-shortcut-keys

theme:
  name: material
  palette:
    - scheme: default
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    language: material/translate
    repo: fontawesome/brands/github

# Explicit nav — paths are language-agnostic; the i18n plugin resolves each
# entry to docs/en/... or docs/ar/... per the active locale.
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - The shortcuts: shortcuts.md
  - Row actions: row-actions.md
  - Letting admins customize: customization.md
  - Custom bindings: custom-bindings.md
  - Configuration: configuration.md
  - Pruning dead overrides: maintenance.md
  - Translations: translations.md
  - Security: security.md
  - Troubleshooting: troubleshooting.md
  - Limitations: limitations.md
  - Architecture: architecture.md
  - Internals:
      - Design notes: internals/architecture.md
      - Resolution: internals/resolution.md
      - Domain model: internals/domain-model.md

plugins:
  - search
  # Requires: pip install mkdocs-static-i18n
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - name: English
          locale: en
          build: true
          default: true
        - name: العربية
          locale: ar
          build: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aristonis/filament-shortcut-keys
    - icon: fontawesome/solid/box
      link: https://packagist.org/packages/aristonis/filament-shortcut-keys

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
